<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WebAR Image Tracking</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
      html, body { 
        margin: 0; 
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden; 
      }
      .a-canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>

    <!-- ปรับแต่ง filterMinCF และ filterBeta ช่วยให้สแกนได้ไวขึ้นแม้มุมเอียง/แนวนอน -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes; filterMinCF: 0.0001; filterBeta: 0.001;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="ar-video" src="./video.mp4" response-type="arraybuffer" loop crossorigin="anonymous" playsinline webkit-playsinline></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
        <a-video src="#ar-video" width="1" height="1" position="0 0 0" rotation="0 0 0" material="fitTexture: true"></a-video>
      </a-entity>

    </a-scene>

    <script>
      const targetEntity = document.querySelector('#target-entity');
      const video = document.querySelector('#ar-video');
      const arVideoElement = document.querySelector('a-video');

      const img = new Image();
      img.src = "./photo.jpg"; 

      let aspectRatio = 1;

      img.onload = function() {
        aspectRatio = this.naturalHeight / this.naturalWidth;
      };

      function updateLayout() {
        if (img.complete && img.naturalWidth !== 0) {
          aspectRatio = img.naturalHeight / img.naturalWidth;
          arVideoElement.setAttribute('width', '1');
          arVideoElement.setAttribute('height', aspectRatio.toString());
        }
        
        // บังคับรีเฟรชขนาดกล้อง AR เมื่อมีการหมุนจอ
        const sceneEl = document.querySelector('a-scene');
        if (sceneEl && sceneEl.systems && sceneEl.systems['mindar-image-system']) {
          sceneEl.resize();
        }
      }

      window.addEventListener('resize', updateLayout);
      window.addEventListener('orientationchange', () => {
        setTimeout(updateLayout, 200);
      });

      targetEntity.addEventListener("targetFound", event => {
        video.play(); 
        updateLayout();
      });

      targetEntity.addEventListener("targetLost", event => {
        video.pause(); 
      });
    </script>

  </body>
</html>
